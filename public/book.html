<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking</title><link rel="stylesheet" href="style.css"></head><body><div class="login" style="max-width:520px;margin:4vh auto"><div id="c">Memuat...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY,{global:{fetch:CFG.fetch}}),sl=new URLSearchParams(location.search).get('v'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{const{data:d}=await sb.rpc('get_vendor_public',{p_slug:sl});if(!d)return $('#c').textContent='Form tidak tersedia.';document.title=d.name;
 $('#c').innerHTML=`${d.logo?`<img src="${esc(d.logo)}" style="height:60px;max-width:100%">`:''}<h3>Booking / cek ketersediaan — ${esc(d.name)}</h3><label>Nama<input id="n"></label><label>WhatsApp<input id="p" type="tel"></label><label>Email (opsional)<input id="e" type="email"></label><label>Tanggal acara<input id="dt" type="date" onchange="chk()"></label><p id="av"></p><label>Paket<select id="pk"><option value="">(belum tahu)</option>${d.packages.map(k=>`<option value="${esc(k.name)}">${esc(k.name)} — Rp ${Number(k.price||0).toLocaleString('id-ID')}</option>`).join('')}</select></label><label>Catatan<textarea id="nt" rows="3"></textarea></label>${(d.reviews||[]).length?`<h4>Kata mereka</h4>${d.reviews.map(r=>`<p>${'★'.repeat(r.rating)} ${esc(r.comment)}</p>`).join('')}`:''}<input id="hp" style="display:none" tabindex="-1" autocomplete="off"><button onclick="go()">Kirim permintaan</button><p id="er" class="err"></p>`})();
async function chk(){const d=$('#dt').value;if(!d)return;const{data}=await sb.rpc('check_date',{p_slug:sl,p_date:d});$('#av').textContent=data===false?'⚠ Tanggal ini sudah penuh/tidak tersedia, namun Anda tetap bisa mengirim permintaan.':'✓ Tanggal masih tersedia.'}
async function go(){if($('#hp').value)return;const{data,error}=await sb.rpc('submit_inquiry',{p_slug:sl,p_name:$('#n').value,p_phone:$('#p').value,p_email:$('#e').value,p_date:$('#dt').value||null,p_package:$('#pk').value||null,p_notes:$('#nt').value});
 if(error||!data?.ok)return $('#er').textContent=data?.limit?'Terlalu banyak permintaan, coba lagi nanti.':'Nama dan WhatsApp wajib diisi.';
 $('#c').innerHTML='<h3>Terima kasih! ✓</h3><p>Permintaan Anda sudah kami terima. Kami akan menghubungi via WhatsApp.</p>'}
</script></body></html>
