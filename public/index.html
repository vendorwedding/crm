<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor CRM</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#9d4a62"><link rel="apple-touch-icon" href="/icon-192.png"></head><body><div id="app"><p style="padding:24px;font:14px system-ui,sans-serif">Memuat aplikasi…</p></div><noscript><p style="padding:24px">Aktifkan JavaScript untuk memakai aplikasi ini.</p></noscript><dialog id="dlg"></dialog>
<script>
function showErr(m){var a=document.getElementById('app');if(a&&(!a.firstElementChild||a.textContent.indexOf('Memuat aplikasi')===0)){a.innerHTML='<div style="max-width:640px;margin:8vh auto;font:14px/1.5 system-ui,sans-serif;padding:18px;border:1px solid #f4c2c2;background:#fff;border-radius:10px"><h3 style="color:#b00020;margin-top:0">Aplikasi gagal dimuat</h3><p><b>Pesan:</b> '+String(m).replace(/</g,'&lt;')+'</p><p>Coba tekan Ctrl+Shift+R. Jika tetap sama, klik tombol di bawah (menghapus cache aplikasi di browser ini, data tidak hilang), lalu kirim pesan di atas ke pengembang.</p><button onclick="resetApp()" style="padding:8px 12px;border:0;border-radius:8px;background:#9d4a62;color:#fff;cursor:pointer">Bersihkan cache &amp; muat ulang</button></div>'}}
window.addEventListener('error',function(e){showErr(e.message||e.error)});window.addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason)});
function resetApp(){(navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([])).then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}).then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}):0}).then(function(){location.reload()})}
setTimeout(function(){var a=document.getElementById('app');if(a&&a.textContent.indexOf('Memuat aplikasi')===0)showErr('Skrip aplikasi tidak berjalan (file lama/tersangkut cache, atau library dari internet diblokir).')},6000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="version.js"></script><script src="app.js"></script></body></html>
